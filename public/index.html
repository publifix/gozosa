<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gozosa — Restaurant &amp; Bar</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #1a1410;
      --fg: #f5ece0;
      --accent: #d4a24e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: var(--bg);
      color: var(--fg);
      font-family: "Georgia", "Times New Roman", serif;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      letter-spacing: 0.05em;
      margin: 0;
      color: var(--accent);
    }
    p {
      font-size: 1.1rem;
      max-width: 32rem;
      line-height: 1.6;
      margin: 0;
    }
    .tag {
      text-transform: uppercase;
      letter-spacing: 0.3em;
      font-size: 0.8rem;
      color: var(--fg);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <span class="tag">Restaurant &amp; Bar</span>
  <h1>Gozosa</h1>
  <p>Sitio en construcción. Este espacio se irá actualizando con cada avance del proyecto.</p>
</body>
</html>
